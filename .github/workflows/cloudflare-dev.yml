name: Validate and deploy PGT DEV

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:
    inputs:
      operation:
        description: 'Solo develop: verificar la versión vigente o desplegar y verificar'
        type: choice
        options: [verify, deploy]
        default: verify

permissions:
  contents: read

# Supersede obsolete PR validation only; never interrupt a DEV upload.
# The head check below also prevents rerunning an old SHA over newer DEV.
concurrency:
  group: pgt-cloudflare-dev-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    # Playwright 1.58.2 does not support Ubuntu 26.04. Keep browser QA on
    # a supported runner instead of inheriting ubuntu-latest image changes.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      VITE_API_BASE_URL: ''
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: 'false'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build frontend PWA
        run: npm run build
      - name: Validate native DEV boundary
        run: node scripts/check-structured-boundary.mjs
      - name: Compile Worker
        run: npm run check:worker
      - name: Worker runtime tests
        run: npm run test:runtime
      - name: DEV Firestore diagnostic runtime (isolated)
        run: node scripts/test-firestore-preflight-runtime.mjs
      - name: DEV Firestore application and realtime runtime (isolated)
        run: node scripts/test-firestore-app-runtime.mjs
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Browser and offline PDF tests
        run: npm run test:browser
      - name: Trainer performance regression
        run: npm run test:performance
      - name: Validate DEV configuration and bundle (offline)
        run: |
          node scripts/check-dev-config.mjs
          npx --no-install wrangler deploy --config wrangler.dev.jsonc --dry-run --outdir .worker-dev-build

  validate-online:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      VITE_API_BASE_URL: ''
      VITE_PERSISTENCE: 'firestore-dev'
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: 'false'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Online DEV frontend and Firestore protocol in isolated browsers
        run: node scripts/test-firestore-online-browser.mjs
      - name: Verify online DEV bundle configuration
        run: |
          node scripts/check-dev-config.mjs
          npx --no-install wrangler deploy --config wrangler.dev.jsonc --dry-run --outdir .worker-dev-build
      - name: Save isolated DEV browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firestore-isolated-browser
          path: |
            artifacts/firestore-local-browser.json
            artifacts/firestore-student.png
            artifacts/firestore-trainer.png
          if-no-files-found: ignore
          retention-days: 7

  deploy-dev:
    needs: [validate, validate-online]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/develop' && vars.DEV_DEPLOY_ENABLED == 'true'
    environment: development
    # Live QA installs the same Playwright Chromium as validation.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: pgt-worker-dev-deployment
      cancel-in-progress: false
    env:
      VITE_API_BASE_URL: ''
      VITE_PERSISTENCE: 'firestore-dev'
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: 'false'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-dev-config.mjs
      - name: Install Chromium for live DEV verification
        run: npx --no-install playwright install --with-deps chromium
      - name: Deploy or verify the current authorized DEV version
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_DEV_ACCOUNT_ID: ${{ vars.DEV_ACCOUNT_ID }}
          DEV_OPERATION: ${{ github.event_name == 'workflow_dispatch' && inputs.operation || 'deploy' }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { spawnSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          for (const key of ['CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID', 'EXPECTED_DEV_ACCOUNT_ID']) {
            if (!process.env[key]) throw new Error(`Missing development configuration: ${key}`);
          }
          if (process.env.CLOUDFLARE_ACCOUNT_ID !== process.env.EXPECTED_DEV_ACCOUNT_ID) throw new Error('DEV account mismatch');
          if (process.env.GITHUB_REF !== 'refs/heads/develop' || process.env.GITHUB_REPOSITORY !== 'dmda92/pgt-bjj-planner' || !['push', 'workflow_dispatch'].includes(process.env.GITHUB_EVENT_NAME)) throw new Error('Invalid deployment event');
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/ref/heads/develop`, {
            headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' }
          });
          if (!response.ok) throw new Error(`Cannot verify authorized HEAD: HTTP ${response.status}`);
          if ((await response.json()).object.sha !== process.env.GITHUB_SHA) {
            console.log('Skipping obsolete commit.');
          } else {
            if(!['verify','deploy'].includes(process.env.DEV_OPERATION))throw new Error('Invalid DEV operation');
            const settings=await fetch(`https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/scripts/pgt-github-probe-dev/settings`,{headers:{Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`}});
            let deployedBuild;
            if(settings.ok){const value=await settings.json();deployedBuild=value.result?.bindings?.find(binding=>binding.name==='DEV_BUILD_SHA')?.text;}
            // A rerun of a failed gate must verify the same live version, not
            // publish it again and change the conditions being diagnosed.
            const verifyOnly=process.env.DEV_OPERATION==='verify'||deployedBuild===process.env.GITHUB_SHA;
            let expectedBuild=verifyOnly?deployedBuild:process.env.GITHUB_SHA;
            if(verifyOnly){
              if(!/^[0-9a-f]{40}$/.test(expectedBuild||''))throw new Error('Deployed DEV build identity missing');
              console.log(JSON.stringify({status:'VERIFY_EXISTING_DEV_WITHOUT_DEPLOY',build:expectedBuild}));
            }else{
              const result = spawnSync('npx', ['--no-install', 'wrangler', 'deploy', '--config', 'wrangler.dev.jsonc', '--name', 'pgt-github-probe-dev', '--var', `DEV_BUILD_SHA:${process.env.GITHUB_SHA}`, '--var', `DEV_ACCOUNT_ID:${process.env.CLOUDFLARE_ACCOUNT_ID}`, '--var', `DEV_DEPLOY_TOKEN_HASH:${createHash('sha256').update(process.env.CLOUDFLARE_API_TOKEN).digest('base64')}`], { stdio: 'inherit' });
              if (result.error) throw result.error;
              if (result.status !== 0) process.exit(result.status ?? 1);
            }
            // Wait for the actual Worker and coordinator build, not an arbitrary
            // delay or the mere success of the upload. Read-only probes only.
            let current=false;
            for(let attempt=0;attempt<45;attempt++){
              try{
                const runtime=await fetch('https://pgt-github-probe-dev.david-dzm5.workers.dev/api/dev/runtime',{cache:'no-store',signal:AbortSignal.timeout(10000)});
                const value=await runtime.json();
                if(runtime.ok&&runtime.headers.get('X-PGT-Worker-Build')===expectedBuild&&value.build===expectedBuild&&value.domainBuild===expectedBuild&&value.revision==='structured-credentials-check-20261021-v1'&&value.project==='pgt-bjj-dev'){
                  console.log(JSON.stringify({status:'DEV_RUNTIME_BUILD_VERIFIED',build:value.build,revision:value.revision,attempts:attempt+1}));current=true;break;
                }
              }catch{}
              if(attempt===0||attempt===44)console.log(JSON.stringify({status:'DEV_RUNTIME_BUILD_PENDING',attempt:attempt+1}));
              await new Promise(resolve=>setTimeout(resolve,2000));
            }
            if(!current)throw new Error('DEV_DEPLOYED_RUNTIME_BUILD_NOT_VERIFIED');
            const preflight = await fetch('https://pgt-github-probe-dev.david-dzm5.workers.dev/api/dev/firestore-preflight', {
              method: 'POST', headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`, Origin: 'https://pgt-github-probe-dev.david-dzm5.workers.dev' }, signal: AbortSignal.timeout(60000)
            });
            const report = await preflight.json();
            console.log(JSON.stringify(report));
            if (!preflight.ok || report.status !== 'FIRESTORE_DEV_CONNECTION_VERIFIED') throw new Error('DEV Firestore preflight failed');
            const qaEnv = {...process.env,PGT_EXPECTED_DEV_BUILD:expectedBuild}; delete qaEnv.PGT_LOCAL_QA_ORIGIN;
            const preparation=spawnSync(process.execPath,['scripts/prepare-structured-dev.mjs'],{stdio:'inherit',env:qaEnv});
            if(preparation.error)throw preparation.error;
            if(preparation.status!==0)process.exit(preparation.status??1);
            const qa = spawnSync(process.execPath, ['scripts/test-firestore-dev-live.mjs'], {stdio:'inherit',env:qaEnv});
            if (qa.error) throw qa.error;
            const integrity=spawnSync(process.execPath,['scripts/verify-structured-dev.mjs'],{stdio:'inherit',env:qaEnv});
            if(integrity.error)throw integrity.error;
            if(integrity.status!==0)process.exit(integrity.status??1);
            if (qa.status !== 0) process.exit(qa.status ?? 1);
          }
          JS
      - name: Save real DEV verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firestore-real-dev
          path: |
            artifacts/structured-dev-preparation.json
            artifacts/structured-dev-integrity.json
            artifacts/firestore-dev-live.json
            artifacts/firestore-student.png
            artifacts/firestore-trainer.png
          if-no-files-found: ignore
          retention-days: 7
