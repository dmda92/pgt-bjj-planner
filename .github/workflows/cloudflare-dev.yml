name: Validate and deploy PGT DEV

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

# Never interrupt an upload in progress. Old pending develop runs may be superseded.
# The head check below also prevents rerunning an old SHA over newer DEV.
concurrency:
  group: pgt-cloudflare-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      VITE_API_BASE_URL: ''
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: 'false'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build frontend PWA
        run: npm run build
      - name: Compile Worker
        run: npm run check:worker
      - name: Worker runtime tests
        run: npm run test:runtime
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Browser and offline PDF tests
        run: npm run test:browser
      - name: Trainer performance regression
        run: npm run test:performance
      - name: Validate DEV configuration and bundle (offline)
        run: |
          node scripts/check-dev-config.mjs
          npx --no-install wrangler deploy --config wrangler.dev.jsonc --dry-run --outdir .worker-dev-build

  deploy-dev:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.DEV_DEPLOY_ENABLED == 'true'
    environment: development
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pgt-worker-dev-deployment
      cancel-in-progress: false
    env:
      VITE_API_BASE_URL: ''
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: 'false'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-dev-config.mjs
      - name: Check current develop HEAD and deploy DEV only
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_DEV_ACCOUNT_ID: ${{ vars.DEV_ACCOUNT_ID }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { spawnSync } from 'node:child_process';
          for (const key of ['CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID', 'EXPECTED_DEV_ACCOUNT_ID']) {
            if (!process.env[key]) throw new Error(`Missing development configuration: ${key}`);
          }
          if (process.env.CLOUDFLARE_ACCOUNT_ID !== process.env.EXPECTED_DEV_ACCOUNT_ID) throw new Error('DEV account mismatch');
          if (process.env.GITHUB_REF !== 'refs/heads/develop' || process.env.GITHUB_EVENT_NAME !== 'push') throw new Error('Invalid deployment event');
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/ref/heads/develop`, {
            headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' }
          });
          if (!response.ok) throw new Error(`Cannot verify develop HEAD: HTTP ${response.status}`);
          if ((await response.json()).object.sha !== process.env.GITHUB_SHA) {
            console.log('Skipping obsolete commit.');
          } else {
            const result = spawnSync('npx', ['--no-install', 'wrangler', 'deploy', '--config', 'wrangler.dev.jsonc', '--name', 'pgt-github-probe-dev'], { stdio: 'inherit' });
            if (result.error) throw result.error;
            process.exit(result.status ?? 1);
          }
          JS
