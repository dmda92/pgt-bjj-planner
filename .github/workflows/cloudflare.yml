name: Validate and deploy PGT

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never interrupt an upload in progress. Old pending main runs may be superseded.
# The head check below also prevents rerunning an old SHA over newer production.
concurrency:
  group: pgt-cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      VITE_API_BASE_URL: ''
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: 'false'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build frontend PWA
        run: npm run build
      - name: Compile Worker
        run: npm run check:worker
      - name: Worker runtime tests
        run: npm run test:runtime
      - name: Install Chromium
        timeout-minutes: 8
        run: bash scripts/ci-install-chromium.sh
      - name: Browser and offline PDF tests
        run: npm run test:browser
      - name: Read-only production inspector (isolated Chromium)
        env:
          PGT_VALIDATION_BROWSER: '1'
        run: node --experimental-strip-types --test tests/pro-validation.test.ts
      - name: Trainer performance regression
        run: npm run test:performance
      - name: Production isolated runtime
        run: node --experimental-strip-types scripts/test-v2-pro-runtime.mjs
      - name: Check Firestore environment and production bundles (offline)
        run: |
          node scripts/check-dev-config.mjs
          node scripts/check-pro-config.mjs
          node scripts/check-pro-support.mjs
      - name: Check latest main commit
        id: head
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' && vars.FIRESTORE_PRO_READY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/ref/heads/main`, {
            headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }
          });
          if (!response.ok) throw new Error(`Cannot verify main HEAD: HTTP ${response.status}`);
          const current = (await response.json()).object.sha;
          const latest = current === process.env.GITHUB_SHA;
          appendFileSync(process.env.GITHUB_OUTPUT, `latest=${latest}\n`);
          if (!latest) console.log('Skipping obsolete commit; main already has a newer revision.');
          JS
      - name: Deploy Worker and PWA assets
        if: steps.head.outputs.latest == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo '::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets.'
            exit 1
          fi
          npx --no-install wrangler deploy --config wrangler.jsonc --keep-vars --var "WORKER_BUILD_SHA:$GITHUB_SHA"
      - name: Initial setup status
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (vars.CLOUDFLARE_DEPLOY_ENABLED != 'true' || vars.FIRESTORE_PRO_READY != 'true')
        run: echo 'Validation passed. Set CLOUDFLARE_DEPLOY_ENABLED=true and FIRESTORE_PRO_READY=true only after migration, integrity review and explicit release authorization.' >> "$GITHUB_STEP_SUMMARY"
